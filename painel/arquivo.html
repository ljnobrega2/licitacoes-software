<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Arquivo estático — Radar de Licitações de Software</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fixa com abas; coluna de filtros à esquerda, lista paginada à direita, ficha lateral ao abrir uma linha. */
:root{
  --fundo:#f3f5f6; --papel:#ffffff; --faixa:#e8ecee; --linha:#d3dadd;
  --tinta:#16242b; --tinta2:#51636c; --tinta3:#7c8b92;
  --acento:#0b5c7a; --acento-fraco:#dcebf1; --sobre-acento:#ffffff;
  --critico:#b3261e; --critico-fundo:#fbe4e1;
  --alerta:#8a5a00; --alerta-fundo:#fcefcf;
  --bom:#1f6b45; --bom-fundo:#dcf0e4;
  --neutro-fundo:#e6eaec;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --fundo:#10181c; --papel:#18232a; --faixa:#1f2c34; --linha:#2e3e47;
    --tinta:#e6edf0; --tinta2:#a5b4bb; --tinta3:#7d8d95;
    --acento:#6cc0de; --acento-fraco:#17394a; --sobre-acento:#08222d;
    --critico:#ff9d94; --critico-fundo:#4a1d1a;
    --alerta:#f0c060; --alerta-fundo:#40300c;
    --bom:#7fd3a4; --bom-fundo:#143a27;
    --neutro-fundo:#26343c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --fundo:#10181c; --papel:#18232a; --faixa:#1f2c34; --linha:#2e3e47;
  --tinta:#e6edf0; --tinta2:#a5b4bb; --tinta3:#7d8d95;
  --acento:#6cc0de; --acento-fraco:#17394a; --sobre-acento:#08222d;
  --critico:#ff9d94; --critico-fundo:#4a1d1a;
  --alerta:#f0c060; --alerta-fundo:#40300c;
  --bom:#7fd3a4; --bom-fundo:#143a27;
  --neutro-fundo:#26343c;
}
*{box-sizing:border-box}
body{background:var(--fundo);color:var(--tinta);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acento)}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--papel);border-bottom:1px solid var(--linha)}
.topo-in{max-width:1500px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.marca{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.marca h1{font-family:var(--cond);font-weight:600;font-size:22px;margin:0;letter-spacing:.01em}
.marca .meta{color:var(--tinta2);font-size:12.5px}
nav.abas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.abas button{border:0;background:none;padding:8px 12px;border-bottom:3px solid transparent;color:var(--tinta2);cursor:pointer;white-space:nowrap;font-weight:500}
nav.abas button:hover{color:var(--tinta)}
nav.abas button[aria-selected="true"]{color:var(--acento);border-bottom-color:var(--acento)}
nav.abas .qt{font-family:var(--mono);font-size:12px;color:var(--tinta3);margin-left:5px}

main{max-width:1500px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:6px;overflow:hidden}
.resumo div{background:var(--papel);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.resumo b{font-family:var(--mono);font-size:21px;font-weight:500}
.resumo span{font-size:12px;color:var(--tinta2)}
.resumo .urg b{color:var(--critico)}
.aviso{background:var(--alerta-fundo);color:var(--alerta);border-radius:6px;padding:8px 12px;font-size:13px}

.corpo{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.filtros{background:var(--papel);border:1px solid var(--linha);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:12px}
.filtros h2{font-family:var(--cond);font-size:15px;margin:0;display:flex;justify-content:space-between;align-items:center}
.filtros label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--tinta2);text-transform:uppercase;letter-spacing:.05em}
.filtros label.chk{flex-direction:row;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--tinta)}
.filtros input[type=text],.filtros input[type=search],.filtros input[type=number],.filtros select,.ficha select,.ficha textarea,.ficha input{width:100%;padding:6px 8px;border:1px solid var(--linha);border-radius:4px;background:var(--fundo);text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--tinta)}
.par{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{border:1px solid var(--linha);background:var(--papel);border-radius:4px;padding:5px 10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--acento);color:var(--acento)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.forte{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
.so-cel{display:none}

.lista{display:flex;flex-direction:column;gap:10px;min-width:0}
.barra{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.barra .conta{color:var(--tinta2)}
.barra .conta b{color:var(--tinta);font-family:var(--mono);font-weight:500}
.barra .ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.barra select{padding:5px 8px;border:1px solid var(--linha);border-radius:4px;background:var(--papel)}
.rolagem{overflow-x:auto;background:var(--papel);border:1px solid var(--linha);border-radius:6px}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta2);text-align:left;font-weight:600;padding:8px 10px;background:var(--faixa);border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--linha);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover{background:var(--acento-fraco)}
td.obj{min-width:280px;max-width:560px}
td.obj .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
td.obj .o{color:var(--tinta2);font-size:12.5px;margin-top:3px}
td.dir{text-align:right;white-space:nowrap}
.sub{color:var(--tinta3);font-size:12px}
.pil{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--neutro-fundo);color:var(--tinta2)}
.pil.crit{background:var(--critico-fundo);color:var(--critico)}
.pil.aler{background:var(--alerta-fundo);color:var(--alerta)}
.pil.bom{background:var(--bom-fundo);color:var(--bom)}
.pil.ac{background:var(--acento-fraco);color:var(--acento)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.vazio{padding:28px;text-align:center;color:var(--tinta2)}
.pag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.pag .at{font-family:var(--mono);color:var(--tinta2);padding:0 6px}

.veu{position:fixed;inset:0;background:rgba(8,16,20,.5);z-index:30}
.ficha{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--papel);z-index:31;overflow-y:auto;border-left:1px solid var(--linha);padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.ficha header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ficha h2{font-family:var(--cond);font-size:20px;margin:0;text-wrap:balance}
.ficha h3{font-family:var(--cond);font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta2);margin:0 0 6px}
.ficha .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.kv div{display:flex;flex-direction:column;gap:1px;min-width:0}
.kv span{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta3)}
.kv b{font-weight:500;overflow-wrap:anywhere}
.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.docs li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.nota{background:var(--faixa);border-radius:6px;padding:10px 12px}
.ia-tr{border:1px solid var(--acento);background:var(--acento-fraco);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ia-tr textarea{width:100%;resize:vertical;padding:8px;border:1px solid var(--linha);border-radius:4px;background:var(--papel)}
.ia-resposta{white-space:pre-wrap;background:var(--papel);padding:10px;border-radius:4px;border:1px solid var(--linha)}
.ficha td input{width:110px;text-align:right}
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bloco{display:flex;flex-direction:column;gap:8px;min-width:0}
.bloco h2{font-family:var(--cond);font-size:17px;margin:0}
.bloco p{margin:0;color:var(--tinta2)}
.kanban-intro{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--papel);border:1px solid var(--linha);border-radius:6px;padding:12px}
.kanban-intro p{margin:0;color:var(--tinta2)}
.kanban{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.kanban-col{width:280px;min-width:280px;background:var(--faixa);border:1px solid var(--linha);border-radius:6px;padding:9px;min-height:190px}
.kanban-col h2{font-family:var(--cond);font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.kanban-col h2 span{font-family:var(--mono);font-size:12px;color:var(--tinta2);font-weight:400}
.kanban-cards{display:flex;flex-direction:column;gap:8px;min-height:130px}
.kanban-card{background:var(--papel);border:1px solid var(--linha);border-radius:5px;padding:9px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.kanban-card:hover{border-color:var(--acento)}
.kanban-card .titulo{font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0}
.kanban-card .rodape{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--tinta2);font-size:12px}
.kanban-card select{width:100%;margin-top:7px;padding:4px 6px;border:1px solid var(--linha);border-radius:4px;background:var(--fundo);font-size:12px}

@media (max-width:900px){
  .corpo{grid-template-columns:1fr}
  .so-cel{display:inline-block}
  .filtros.fechado>*:not(h2){display:none}
}
@media (max-width:640px){
  .rolagem.cartoes{overflow:visible;background:none;border:0}
  .cartoes table,.cartoes tbody,.cartoes tr,.cartoes td{display:block;width:100%}
  .cartoes thead{display:none}
  .cartoes tr{background:var(--papel);border:1px solid var(--linha);border-radius:6px;margin-bottom:8px;padding:6px 2px}
  .cartoes td{border:0;padding:4px 10px;text-align:left}
  .cartoes td.dir{text-align:left}
  td.obj{min-width:0}
}
</style>

<header class="topo">
  <div class="topo-in">
    <div class="marca">
      <h1>Radar de Licitações de Software</h1>
      <span class="meta" id="meta"></span>
    </div>
    <nav class="abas" id="abas" role="tablist"></nav>
  </div>
</header>
<main id="main"></main>
<div id="ficha-raiz"></div>

<script src="config.js"></script>
<script src="dados.js"></script>
<script>
(function(){
"use strict";
const D=window.DADOS||{abertas:[],atas:[],vencidas:[],revisar:[],pcp:[],sebrae:[],estadual:[],cobertura:[],totais:{}};
const TR_API=window.RADAR_TR_API||'';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const brl=v=>v==null||v===''||isNaN(v)?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const AGORA=Date.now();
const data=s=>{if(!s)return null;const d=new Date(s);return isNaN(d)?null:d};
const fmtData=s=>{const d=data(s);return d?d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'};
function prazo(s){
  const d=data(s);if(!d)return{t:'sem data',c:''};
  const h=(d-AGORA)/36e5;
  if(h<=0)return{t:'encerrado',c:''};
  if(h<24)return{t:'em '+Math.max(1,Math.round(h))+' h',c:'crit'};
  if(h<72)return{t:'em '+Math.round(h/24)+' d',c:'aler'};
  return{t:'em '+Math.round(h/24)+' d',c:'bom'};
}
const CL_CURTO={'Licenças comerciais identificadas':'Licença comercial','Software sem marca / validar fornecimento':'Software sem marca','Sistema especializado / serviços':'Sistema com serviços','Hardware ou solução integrada':'Hardware / solução integrada','Fora do foco / conferir itens':'Fora do foco','Curso / fora do foco':'Curso'};
const clCurto=c=>CL_CURTO[c]||c||'—';

/* Marcações do usuário: ficam só neste navegador. */
const MEUS=['','Aguardando documentação','Compatível','Em cotação','Disputada','Declinada','Perdida','Ganha'];
let marcas={};
try{marcas=JSON.parse(localStorage.getItem('radar-licit-marcas')||'{}')||{}}catch(e){marcas={}}
function salvarMarcas(){try{localStorage.setItem('radar-licit-marcas',JSON.stringify(marcas))}catch(e){}}
const STATUS_LEGADO={'Interessa':'Compatível','Cotando':'Em cotação','Proposta enviada':'Disputada','Descartada':'Declinada'};
Object.values(marcas).forEach(m=>{if(m&&STATUS_LEGADO[m.s])m.s=STATUS_LEGADO[m.s]});salvarMarcas();

D.abertas.forEach(r=>{r._b=norm([r.obj,r.org,r.un,r.cid,r.tit,r.id,(r.mc||[]).join(' '),(r.sv||[]).join(' '),(r.it||[]).map(i=>i.d).join(' ')].join(' '))});
['atas','vencidas','revisar'].forEach(k=>D[k].forEach(r=>{r._b=norm([r.obj,r.org,r.un,r.cid,r.tit,r.id,(r.mc||[]).join(' '),(r.sv||[]).join(' ')].join(' '))}));
D.pcp.forEach(r=>{r._b=norm([r.obj,r.org,r.cid,r.proc,r.mc].join(' '))});
D.sebrae.forEach(r=>{r._b=norm([r.obj,r.org,r.num,r.mc].join(' '))});

const uniq=(rows,f)=>{const m=new Map();rows.forEach(r=>{[].concat(f(r)).forEach(v=>{if(v!=null&&v!=='')m.set(v,(m.get(v)||0)+1)})});return[...m.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'pt'))};
const opts=(pares,rot)=>'<option value="">'+esc(rot)+'</option>'+pares.map(([v,n])=>'<option value="'+esc(v)+'">'+esc(v)+' ('+n+')</option>').join('');

/* ---------- definição das abas ---------- */
const colPrazo=r=>{const p=prazo(r.fim);return '<span class="pil '+p.c+'">'+p.t+'</span><div class="sub num">'+fmtData(r.fim)+'</div>'};
const serviceTags=r=>(r.sv||[]).map(s=>'<span class="pil bom">'+esc(s)+'</span>').join('');
const colObj=r=>'<div class="tags">'+((r.mc||[]).map(m=>'<span class="pil ac">'+esc(m)+'</span>').join(''))+serviceTags(r)+'<span class="pil">'+esc(clCurto(r.cl))+'</span>'+(r.me?'<span class="pil aler">Exclusivo ME/EPP</span>':'')+(r.dup?'<span class="pil">Possível duplicidade</span>':'')+'</div><div class="t">'+esc(r.obj)+'</div><div class="o">'+esc(r.un||r.org||'')+'</div>';
const colLocal=r=>esc(r.cid||'—')+'<div class="sub">'+esc(r.uf||'')+(r.esf?' · '+esc(r.esf):'')+'</div>';
const colValor=r=>'<span class="num">'+brl(r.val)+'</span>'+(r.val?'<div class="sub num" title="Teto de custo para imposto de 6% e margem de 15% sobre a venda">teto '+brl(Math.floor(r.val*79)/100)+'</div>':'');

const ABAS=[
 {id:'abertas',nome:'Abertas',rows:D.abertas,ficha:true,
  cols:[['Prazo',colPrazo],['Objeto',colObj,'obj'],['Local',colLocal],['Valor estimado',colValor,'dir'],['Modalidade',r=>esc(r.mod||'—')+(r.srp?'<div class="sub">Registro de preços</div>':'')],['Docs',r=>'<span class="num">'+(r.docs?r.docs.length:0)+'</span><div class="sub num">'+(r.nit||0)+' itens</div>','dir'],['Minha marcação',r=>{const m=marcas[r.id];return m&&m.s?'<span class="pil '+(m.s==='Descartada'?'':'ac')+'">'+esc(m.s)+'</span>':'<span class="sub">—</span>'}]],
  filtros:['q','cl','sv','mc','uf','esf','mod','prazo','valor','me','docs','srp','semdup','meu'],
  ordens:[['fim','Prazo mais próximo'],['-val','Maior valor'],['val','Menor valor'],['-pub','Publicação mais recente']],
  aviso:'Prazos vêm do cadastro PNCP. Confirme suspensão, retificação e horário no portal de disputa antes de participar. Classificação automática não comprova autorização de revenda.'},
 {id:'kanban',nome:'Kanban',custom:renderKanban,rows:D.abertas},
 {id:'atas',nome:'Atas vigentes',rows:D.atas,
  cols:[['Fim da vigência',r=>'<span class="num">'+fmtData(r.fim)+'</span>'],['Objeto',colObj,'obj'],['Local',colLocal],['Valor global',r=>'<span class="num">'+brl(r.val)+'</span>','dir'],['Adesão',r=>esc(r.ad||'—')],['PNCP',r=>'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">abrir</a>']],
  filtros:['q','cl','sv','mc','uf','esf','valor'],ordens:[['fim','Vence primeiro'],['-fim','Vence por último'],['-val','Maior valor']],
  aviso:'Atas já têm fornecedor selecionado. Servem para conhecer compradores, preços e renovações futuras; não são disputa aberta.'},
 {id:'externas',nome:'Fora do PNCP',custom:renderExternas,rows:[].concat(D.pcp,D.sebrae,D.estadual)},
 {id:'revisar',nome:'Revisar',rows:D.revisar,
  cols:[['Prazo',colPrazo],['Objeto',colObj,'obj'],['Local',colLocal],['Valor estimado',r=>'<span class="num">'+brl(r.val)+'</span>','dir'],['Modalidade',r=>esc(r.mod||'—')],['PNCP',r=>'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">abrir</a>']],
  filtros:['q','uf','esf','mod','prazo','valor'],ordens:[['fim','Prazo mais próximo'],['-val','Maior valor']],
  aviso:'Contratações com proposta aberta cujo objeto cita sistema, plataforma ou termo parecido, mas que a triagem não reconheceu como licença. Use a busca para garimpar; objeto resumido.'},
 {id:'vencidas',nome:'Vencidas e inconsistentes',rows:D.vencidas,
  cols:[['Situação',r=>'<span class="pil">'+esc(r.st)+'</span>'],['Fim',r=>'<span class="num">'+fmtData(r.fim)+'</span>'],['Objeto',colObj,'obj'],['Local',colLocal],['Valor',r=>'<span class="num">'+brl(r.val)+'</span>','dir'],['PNCP',r=>'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">abrir</a>']],
  filtros:['q','st','cl','sv','mc','uf'],ordens:[['-fim','Fim mais recente'],['fim','Fim mais antigo'],['-val','Maior valor']],
  aviso:'Prazos encerrados, suspensas/canceladas, atas vencidas e cadastros com data absurda (2030, 2099). Guardados para conferência.'},
 {id:'cobertura',nome:'Cobertura',custom:renderCobertura,rows:D.cobertura}
];
const est={};ABAS.forEach(a=>est[a.id]={f:{},ord:a.ordens?a.ordens[0][0]:'',pag:1,tam:25});
let abaAtual='abertas';

/* ---------- filtros ---------- */
function passa(a,r,f){
  if(f.q){const ts=norm(f.q).split(/\s+/).filter(Boolean);for(const t of ts)if(!r._b.includes(t))return false}
  if(f.cl&&r.cl!==f.cl)return false;
  if(f.sv&&!(r.sv||[]).includes(f.sv))return false;
  if(f.st&&r.st!==f.st)return false;
  if(f.mc&&!(r.mc||[]).includes(f.mc))return false;
  if(f.uf&&r.uf!==f.uf)return false;
  if(f.esf&&r.esf!==f.esf)return false;
  if(f.mod&&r.mod!==f.mod)return false;
  if(f.prazo){const d=data(r.fim);if(!d)return false;const h=(d-AGORA)/36e5;if(f.prazo==='enc'){if(h>0)return false}else if(h<=0||h>Number(f.prazo))return false}
  if(f.vmin&&!(r.val>=Number(f.vmin)))return false;
  if(f.vmax&&!(r.val!=null&&r.val<=Number(f.vmax)))return false;
  if(f.me&&!r.me)return false;
  if(f.docs&&!(r.docs&&r.docs.length))return false;
  if(f.srp&&!r.srp)return false;
  if(f.semdup&&r.dup)return false;
  if(f.meu){const s=(marcas[r.id]||{}).s||'';if(f.meu==='*'?!s:f.meu==='-'?s==='Declinada':s!==f.meu)return false}
  return true;
}
function ordenar(rows,ord){
  if(!ord)return rows;const desc=ord[0]==='-';const k=desc?ord.slice(1):ord;
  return rows.slice().sort((x,y)=>{let a=x[k],b=y[k];if(a==null||a==='')return 1;if(b==null||b==='')return -1;return (a<b?-1:a>b?1:0)*(desc?-1:1)});
}

  if(r.it&&r.it.length){
    h+='<section><h3>Itens ('+r.nit+') — preencha seu custo para ver o lance mínimo</h3><div class="rolagem"><table><thead><tr><th>#</th><th>Descrição</th><th style="text-align:right">Qtd</th><th style="text-align:right">Ref. unitária</th><th style="text-align:right">Teto de custo unit.</th><th style="text-align:right">Meu custo unit. (R$)</th><th style="text-align:right">Lance mínimo unit.</th></tr></thead><tbody>';
    r.it.forEach((i,k)=>{h+='<tr><td class="num">'+esc(i.n)+'</td><td style="min-width:220px">'+esc(i.d)+(i.b&&!/n.o se aplica|sem benef/i.test(i.b)?'<div class="sub">'+esc(i.b)+'</div>':'')+'</td><td class="dir num">'+(i.q==null?'—':Number(i.q).toLocaleString('pt-BR'))+'<div class="sub">'+esc(i.u||'')+'</div></td><td class="dir num">'+brl(i.vu)+'</td><td class="dir num">'+(i.vu?brl(Math.floor(i.vu*79)/100):'—')+'</td><td class="dir"><input type="number" min="0" step="0.01" id="custo-'+k+'" data-custo="'+k+'" data-ref="'+(i.vu||'')+'" aria-label="Meu custo unitário do item '+esc(i.n)+'"></td><td class="dir num" id="lance-'+k+'">—</td></tr>'});
    h+='</tbody></table></div><div class="sub" style="margin-top:4px">Lance mínimo = custo ÷ 0,79 (imposto de 6% e margem de 15% sobre a venda). Confira se a unidade é usuário, pacote, mês ou crédito.'+(r.nit>r.it.length?' Mostrando os primeiros '+r.it.length+' itens.':'')+'</div></section>';
  }else h+='<section><h3>Itens</h3><div class="sub">'+(r.det?'Sem itens no cadastro.':'Itens ainda não consultados para esta contratação.')+'</div></section>';
  if(r.info)h+='<section><h3>Informação complementar do cadastro</h3><div class="txt">'+esc(r.info)+'</div></section>';
  h+='<section><h3>Minha marcação (fica só neste navegador)</h3><div class="kv"><div><span>Status</span><select id="meu-status" data-meu="s">'+MEUS.map(x=>'<option value="'+x+'"'+(x===m.s?' selected':'')+'>'+(x||'Sem marcação')+'</option>').join('')+'</select></div></div><textarea id="meu-nota" data-meu="n" rows="3" placeholder="Anotações: cotação recebida, contato do distribuidor, dúvidas do edital" style="margin-top:8px">'+esc(m.n||'')+'</textarea></section>';
  h+='</aside>';
  const raiz=$('#ficha-raiz');raiz.innerHTML=h;raiz.dataset.id=id;$('#fechar-ficha').focus();
}
function fecharFicha(){const raiz=$('#ficha-raiz');if(!raiz.innerHTML)return;raiz.innerHTML='';delete raiz.dataset.id;const a=ABAS.find(x=>x.id===abaAtual);if(!a.custom)renderLista(a)}
async function perguntarTR(){
  const raiz=$('#ficha-raiz'),id=raiz.dataset.id,r=D.abertas.find(x=>x.id===id),pergunta=$('#tr-pergunta')?.value.trim(),saida=$('#tr-resposta');
  const indice=Number($('#tr-doc')?.value||0),doc=r&&r._docsIA&&r._docsIA[indice];
  if(!pergunta||!doc||!saida)return;
  const botao=$('[data-acao="perguntar-tr"]',raiz);botao.disabled=true;saida.hidden=false;saida.textContent='Lendo o documento e preparando a resposta…';
  try{
    const res=await fetch(TR_API.replace(/\/$/,'')+'/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({documentUrl:doc.u,documentName:doc.n||doc.t||'documento.pdf',question:pergunta,opportunityId:id})});
    const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||'Não foi possível consultar o documento.');
    saida.textContent=body.answer||'A IA não retornou uma resposta.';
  }catch(err){saida.textContent='Erro: '+(err.message||'falha ao consultar a IA.');}
  finally{botao.disabled=false}
}
async function estimarCusto(){
  const raiz=$('#ficha-raiz'),id=raiz.dataset.id,r=D.abertas.find(x=>x.id===id),saida=$('#tr-resposta');
  const indice=Number($('#tr-doc')?.value||0),doc=r&&r._docsIA&&r._docsIA[indice],premissas=$('#custo-premissas')?.value.trim()||'';
  if(!doc||!saida)return;
  const botao=$('[data-acao="estimar-custo"]',raiz);botao.disabled=true;saida.hidden=false;saida.textContent='Lendo o documento e estruturando a estimativa…';
  try{
    const res=await fetch(TR_API.replace(/\/$/,'')+'/estimate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({documentUrl:doc.u,documentName:doc.n||doc.t||'documento.pdf',assumptions:premissas,opportunityId:id})});
    const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||'Não foi possível estimar o custo.');
    saida.textContent=body.answer||'A IA não retornou uma estimativa.';
  }catch(err){saida.textContent='Erro: '+(err.message||'falha ao consultar a IA.');}
  finally{botao.disabled=false}
}

/* ---------- eventos ---------- */
$('#abas').innerHTML=ABAS.map(a=>'<button role="tab" type="button" data-aba="'+a.id+'">'+a.nome+'<span class="qt">'+a.rows.length.toLocaleString('pt-BR')+'</span></button>').join('');
$('#meta').textContent='Dados coletados em '+fmtData(D.geradoEm)+' (Brasília) · PNCP, Portal de Compras Públicas e SEBRAE · levantamento não exaustivo';
document.addEventListener('click',ev=>{
  const t=ev.target;
  const aba=t.closest('[data-aba]');if(aba){abaAtual=aba.dataset.aba;try{history.replaceState(null,'','#'+abaAtual)}catch(e){}renderAba();window.scrollTo(0,0);return}
  const pg=t.closest('[data-pag]');if(pg&&!pg.disabled){est[abaAtual].pag=Number(pg.dataset.pag);renderLista(ABAS.find(x=>x.id===abaAtual));$('#lista').scrollIntoView({block:'start'});return}
  const ac=t.closest('[data-acao]');
  if(ac){const k=ac.dataset.acao;
    if(k==='fechar'){fecharFicha();return}
    if(k==='limpar'){est[abaAtual].f={};est[abaAtual].pag=1;renderAba();return}
    if(k==='limpar-kanban'){Object.keys(marcas).forEach(id=>{if(marcas[id])marcas[id].s=''});salvarMarcas();renderAba();return}
    if(k==='alternar-filtros'){$('#filtros').classList.toggle('fechado');return}
    if(k==='perguntar-tr'){perguntarTR();return}
    if(k==='estimar-custo'){estimarCusto();return}
  }
  const card=t.closest('[data-kanban-id]');if(card&&!t.closest('a,button,input,select,textarea')){abrirFicha(card.dataset.kanbanId);return}
  if(t.closest('a,button,input,select,textarea'))return;
  const tr=t.closest('tr[data-id]');if(tr)abrirFicha(tr.dataset.id);
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape')fecharFicha();
  if(ev.key==='Enter'&&ev.target.matches&&ev.target.matches('tr[data-id]'))abrirFicha(ev.target.dataset.id);
});
let espera;
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.f){const e=est[abaAtual];e.f[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;e.pag=1;clearTimeout(espera);espera=setTimeout(()=>renderLista(ABAS.find(x=>x.id===abaAtual)),t.type==='search'||t.type==='number'?180:0);return}
  if(t.dataset.custo!=null){const v=parseFloat(t.value),ref=parseFloat(t.dataset.ref),alvo=$('#lance-'+t.dataset.custo);if(!(v>0)){alvo.textContent='—';return}const lance=Math.ceil(v/0.79*100)/100;alvo.innerHTML=brl(lance)+(ref?'<div class="sub">'+(lance<=ref?'cabe na referência':'acima da referência')+'</div>':'');return}
  if(t.dataset.meu){const id=$('#ficha-raiz').dataset.id;if(!id)return;const m=marcas[id]||{s:'',n:''};m[t.dataset.meu]=t.value;if(!m.s&&!m.n)delete marcas[id];else marcas[id]=m;salvarMarcas()}
});
document.addEventListener('change',ev=>{
  const t=ev.target,e=est[abaAtual];
  if(t.dataset.kanbanStatus){const id=t.dataset.kanbanStatus,m=marcas[id]||{s:'',n:''};m.s=t.value;if(!m.s&&!m.n)delete marcas[id];else marcas[id]=m;salvarMarcas();renderAba();return}
  if(t.dataset.acao==='ord'){e.ord=t.value;e.pag=1;renderLista(ABAS.find(x=>x.id===abaAtual))}
  if(t.dataset.acao==='tam'){e.tam=Number(t.value);e.pag=1;renderLista(ABAS.find(x=>x.id===abaAtual))}
});
const h0=(location.hash||'').slice(1);if(ABAS.some(a=>a.id===h0))abaAtual=h0;
renderAba();
})();
</script>
